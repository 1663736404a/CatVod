name: Build CatVod Spider JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "jar/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build-jar.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build custom_spider.jar
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build JAR to jar directory
        shell: pwsh
        run: |
          .\gradlew.bat clean spiderJar --no-daemon --stacktrace

          if (-not (Test-Path ".\jar\custom_spider.jar")) {
            throw "Build failed: jar\custom_spider.jar was not generated."
          }

          Write-Host "Generated files:"
          Get-ChildItem ".\jar\custom_spider.jar", ".\jar\custom_spider.jar.md5" |
            Select-Object Name, Length, LastWriteTime

      - name: Upload generated JAR
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider-${{ github.run_number }}
          path: |
            jar/custom_spider.jar
            jar/custom_spider.jar.md5
          if-no-files-found: error
          retention-days: 30
